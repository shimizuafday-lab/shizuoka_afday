<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静岡市 放課後等デイサービスガイド｜管理</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--c1:#1677c8;--c2:#16a58b;--ink:#1f3140;--mute:#667784;--line:#e3edf2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f1f6f9;color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1677c8,#16a58b);color:#fff;box-shadow:0 4px 16px rgba(22,70,100,.18)}
.hbar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font-size:16px}.brand small{display:block;font-size:11px;opacity:.92;margin-top:2px}
.hbtn{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:18px 16px 60px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(22,70,100,.07);padding:18px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 6px}
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;font-size:14px;cursor:pointer;background:#e8eff4;color:#34505f;font-family:inherit}
.btn:hover{filter:brightness(.96)}
.primary{background:var(--c1);color:#fff}.green{background:var(--c2);color:#fff}
.muted{color:var(--mute);font-size:13px;line-height:1.7}
body:not(.authed) .needauth{display:none !important}
input[type=file]{width:100%;padding:16px;border:2px dashed #bcd3e0;border-radius:14px;background:#f7fbfd;font-size:14px;cursor:pointer;font-family:inherit}
input[type=file]::file-selector-button{border:0;border-radius:9px;background:var(--c1);color:#fff;font-weight:800;padding:9px 14px;margin-right:12px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2}.stat span{font-size:12px;color:var(--mute);font-weight:700}.stat.ok b{color:#147a58}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1 1 240px;width:auto}.toolbar select{flex:0 0 170px;width:auto}
.toolbar input,.toolbar select,.field input,.field textarea,.field select{padding:11px 12px;border:1.5px solid #d8e5ec;border-radius:11px;width:100%;font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
.toolbar input:focus,.toolbar select:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:var(--c1);box-shadow:0 0 0 3px rgba(22,119,200,.15)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.pcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 8px 24px rgba(22,70,100,.14)}
.pthumb{height:130px;background:#eaf3f8;position:relative;display:flex;align-items:center;justify-content:center;color:#8aa0ad;font-size:12px;font-weight:800}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .status{position:absolute;right:10px;top:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{margin:0;font-size:16px;line-height:1.4}
.ptimes{font-size:12.5px;color:#4d5f6c;line-height:1.7}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{padding:4px 9px;border-radius:999px;background:#eaf5ff;color:var(--c1);font-size:11.5px;font-weight:800}
.pfoot{padding:0 14px 14px}.pfoot .btn{width:100%}
.provider{border:1px solid #dfe9ef;border-radius:14px;padding:12px 14px;margin-top:10px}
.provider label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer}
.status{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#fff3cd;color:#8a6500}
.status.open{background:#dff7ec;color:#147a58}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#login{max-width:420px;margin:40px auto}#login .grid{grid-template-columns:1fr}
#edit{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);z-index:60;margin:0;border-radius:18px 0 0 18px;overflow:auto;box-shadow:0 0 0 100vmax rgba(10,30,45,.45),-12px 0 48px rgba(10,30,45,.3)}
.edith{position:sticky;top:-18px;z-index:2;background:#fff;margin:-18px -18px 16px !important;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.edith small{margin-left:10px;color:var(--mute);font-size:12px;font-weight:700}
#edit .actions{position:sticky;bottom:-18px;background:#fff;padding:12px 0 4px;border-top:1px solid var(--line);margin-bottom:-4px}
.photoPreview{margin-top:8px;min-height:72px;border:1px dashed #d5e1e8;border-radius:10px;background:#f8fbfd;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;color:#667784;font-size:12px}.photoPreview img{display:block;max-width:100%;max-height:180px;border-radius:8px;object-fit:contain}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.toolbar select{flex:1 1 100%}#edit{border-radius:0}.pgrid{grid-template-columns:1fr}}
</style></head><body><header><div class="hbar"><div class="brand"><b>静岡市 放課後等デイサービスガイド</b><small>管理画面</small></div><button class="hbtn needauth" onclick="auth.signOut()">ログアウト</button></div></header><main class="wrap"><div class="panel needauth"><h2 style="margin-top:0">Excelを取り込む</h2><p class="muted">GoogleスプレッドシートからダウンロードしたExcelを、そのまま選択してください。CSVへの変換は不要です。<br>ログイン後に取り込むと、登録済みの事業所との<b>差分（新規・変更）</b>を確認してから一括登録できます。</p><input id="file" type="file" accept=".xlsx,.xls" onchange="importExcel(event)"><p id="msg" class="muted"></p></div><div id="stats" class="stats needauth"></div><div class="panel needauth"><div class="toolbar"><input id="q" placeholder="事業所名・住所・学校名で検索"><select id="pub"><option value="">公開状態：すべて</option><option>公開</option><option>非公開</option></select><button class="btn green" onclick="bulkPublish('公開')">表示中を一括公開</button><button class="btn" style="background:#e8eef3" onclick="bulkPublish('非公開')">表示中を一括非公開</button></div><div id="list"></div></div><div id="edit" class="panel needauth" style="display:none"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCLRfCIwnp6RoXg7SORwy32N_q_OzOGroQ",
  authDomain: "shizuoka-afday.firebaseapp.com",
  projectId: "shizuoka-afday",
  storageBucket: "shizuoka-afday.firebasestorage.app",
  messagingSenderId: "717009789129",
  appId: "1:717009789129:web:b2c38c9fc726447254ed18"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth();
const TYPES=['総合型（生活能力向上）','総合型（重度）','学習型','運動型','就労準備型','重心医ケア'];
let rows=[]; const $=x=>document.getElementById(x);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function photoPreview(u){
 const s=String(u??'').trim(); if(!s)return '';
 const m=s.match(/[?&]id=([^&]+)/)||s.match(/\/d\/([^/]+)/);
 return m?`https://drive.google.com/thumbnail?id=${encodeURIComponent(m[1])}&sz=w900`:s;
}
function updatePhotoPreview(n){
 const input=$('e_photo'+n), img=$('p_photo'+n), text=$('pt_photo'+n);
 if(!input||!img||!text)return;
 const u=input.value.trim(), src=photoPreview(u);
 if(!u){img.style.display='none';text.textContent='写真'+n+'は未登録です';return}
 img.style.display='block';text.textContent='読み込み中…';img.src=src;
 img.onload=()=>{text.textContent='';};
 img.onerror=()=>{img.style.display='none';text.textContent='画像を表示できません。Driveの共有設定やURLを確認してください。';};
}
function splitD(v){return String(v??'').split(/,\s*|\n/).map(x=>x.trim()).filter(Boolean)}
function split(v){return String(v??'').split(/[,、\n]/).map(x=>x.trim()).filter(Boolean)}
function formatTime(v){
 if(v==null||v==='')return '';
 if(v instanceof Date)return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
 if(typeof v==='number'){let t=Math.round((v-Math.floor(v))*1440);let h=Math.floor(t/60)%24,m=t%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
 let s=String(v).trim(),m=s.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);return m?String(m[1]).padStart(2,'0')+':'+m[2]:s;
}
function time(a,b){a=formatTime(a);b=formatTime(b);return a&&b?`${a}〜${b}`:a||b||''}
function get(r,...ns){for(const n of ns)if(r[n]!==''&&r[n]!=null)return r[n];return ''}
function normalize(r,i){return {id:get(r,'事業所ID')||'SVD-'+String(i+1).padStart(3,'0'),name:get(r,'事業所名'),kana:get(r,'ふりがな','事業所名（ふりがな）','事業所名ふりがな'),_hasId:!!get(r,'事業所ID'),types:split(get(r,'事業所の型')),ward:get(r,'静岡市区'),address:get(r,'事業所住所'),phone:get(r,'電話番号'),hp:get(r,'ホームページURL'),weekday:time(get(r,'平日の営業開始時間'),get(r,'平日の営業終了時間')),holiday:time(get(r,'休日・長期休暇の営業開始時間'),get(r,'休日・長期休暇の営業終了時間')),openDays:splitD(get(r,'営業日')).join('・'),closedDays:splitD(get(r,'閉所日')).join('・'),transport:get(r,'送迎サービス'),food:get(r,'食事提供'),schools:split(get(r,'主な通学先')),appeal:get(r,'事業所の説明（アピールポイント）'),photo1:get(r,'事業所写真①'),photo2:get(r,'事業所写真②'),photo3:get(r,'事業所写真③'),published:get(r,'公開')||'非公開'}}

/* ===== 差分取り込み ===== */
const KEYS=['name','kana','types','ward','address','phone','hp','weekday','holiday','openDays','closedDays','transport','food','schools','appeal','photo1','photo2','photo3'];
const LABEL={name:'事業所名',kana:'ふりがな',types:'事業所の型',ward:'区',address:'住所',phone:'電話',hp:'HP',weekday:'平日の時間',holiday:'休日の時間',openDays:'営業日',closedDays:'閉所日',transport:'送迎',food:'食事',schools:'主な通学先',appeal:'説明',photo1:'写真①',photo2:'写真②',photo3:'写真③'};
const val=(r,k)=>Array.isArray(r[k])?r[k].join('、'):String(r[k]??'').trim();
const nkey=s=>String(s||'').normalize('NFKC').replace(/\s+/g,'');
let plan=[];
function buildPlan(imp){
 const byId=new Map(rows.map(r=>[r.id,r])),byName=new Map(rows.map(r=>[nkey(r.name),r]));
 let max=Math.max(0,...rows.map(r=>parseInt(String(r.id).replace(/\D/g,''))||0));
 plan=imp.map(n=>{
  const old=(n._hasId&&byId.get(n.id))||byName.get(nkey(n.name));
  if(!old){const id=n._hasId?n.id:'SVD-'+String(++max).padStart(3,'0');return {type:'new',id,data:{...n,id}}}
  const diffs=KEYS.filter(k=>!(k==='kana'&&!val(n,k))&&val(n,k)!==val(old,k)).map(k=>({k,from:val(old,k),to:val(n,k)}));
  return {type:diffs.length?'chg':'same',id:old.id,data:n,diffs};
 });
 renderPlan();
}
function renderPlan(){
 let p=$('plan');if(!p){p=document.createElement('div');p.id='plan';p.className='panel';$('list').parentNode.before(p)}
 const n=plan.filter(x=>x.type==='new').length,c=plan.filter(x=>x.type==='chg').length,s=plan.length-n-c;
 p.innerHTML=`<h2 style="margin-top:0">取り込みの差分</h2><p class="muted">新規 ${n}件 ／ 変更あり ${c}件 ／ 変更なし ${s}件<br>新規は初期状態で選択済み、変更ありは内容を確認して選択してください（変更は差分の項目だけ更新され、公開状態は変わりません）。</p>`
 +plan.map((x,i)=>x.type==='same'?'':`<div class="provider"><label><input type="checkbox" class="pchk" data-i="${i}" ${x.type==='new'?'checked':''}> <span class="status ${x.type==='new'?'open':''}">${x.type==='new'?'新規':'変更'}</span> <b>${esc(x.data.name)}</b> <span class="muted">${esc(x.id)}</span></label>${(x.diffs||[]).map(d=>`<div class="muted" style="margin-top:4px">${esc(LABEL[d.k])}：${esc(d.from||'(空)')} → <b>${esc(d.to||'(空)')}</b></div>`).join('')}</div>`).join('')
 +(n+c?'':'<p class="muted">登録が必要な差分はありません。</p>')
 +`<div class="actions"><button class="btn" onclick="document.querySelectorAll('.pchk').forEach(c=>c.checked=true)">すべて選択</button><button class="btn" onclick="$('plan').remove()">閉じる</button><button class="btn green" onclick="applyPlan()">選択した分を一括登録</button></div>`;
 p.scrollIntoView({behavior:'smooth',block:'start'});
}
async function saveBatches(ops){
 for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
}
async function applyPlan(){
 const sel=[...document.querySelectorAll('.pchk:checked')].map(c=>plan[+c.dataset.i]);
 if(!sel.length){alert('登録する事業所を選んでください。');return}
 if(!confirm(sel.length+'件を登録します。よろしいですか？'))return;
 try{
  await saveBatches(sel.map(x=>b=>{
   const ref=db.collection('providers').doc(x.id);
   if(x.type==='new'){const d={...x.data};delete d._hasId;b.set(ref,d)}
   else{const d={};x.diffs.forEach(df=>d[df.k]=x.data[df.k]);b.set(ref,d,{merge:true})}
  }));
  if($('plan'))$('plan').remove();await loadFirestore();alert(sel.length+'件を登録しました。')
 }catch(e){alert('登録に失敗しました：'+e.message)}
}
/* ===== 一括公開／非公開（表示中の一覧が対象） ===== */
function getFiltered(){
 const s=$('q').value.trim().toLowerCase(),p=$('pub').value;
 return rows.filter(r=>(!s||[r.name,r.address,r.ward,...(r.schools||[])].join(' ').toLowerCase().includes(s))&&(!p||r.published===p));
}
async function bulkPublish(state){
 if(!auth.currentUser){alert('先に管理者ログインをしてください。');return}
 const a=getFiltered();
 if(!a.length){alert('対象の事業所がありません。');return}
 if(!confirm('表示中の'+a.length+'件を「'+state+'」にします。よろしいですか？'))return;
 try{
  await saveBatches(a.map(r=>b=>b.set(db.collection('providers').doc(r.id),{published:state},{merge:true})));
  a.forEach(r=>r.published=state);render();alert('完了しました。')
 }catch(e){alert('保存に失敗しました：'+e.message)}
}

function importExcel(e){
 const f=e.target.files[0];if(!f)return;
 if(!auth.currentUser){alert('先に管理者ログインをしてください（登録済みデータとの比較に必要です）。');e.target.value='';return}
 $('msg').textContent='読み込み中…';setTimeout(()=>{e.target.value=''},0);
 const rd=new FileReader();rd.onload=x=>{try{
  const wb=XLSX.read(x.target.result,{type:'array',cellDates:true});
  const sn=wb.SheetNames.find(n=>n==='フォームの回答 1')||wb.SheetNames[0];
  const imported=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:true}).map(normalize).filter(r=>r.name);
  $('msg').textContent=`Excelから${imported.length}件を読み込みました。登録済みデータとの差分を確認してください。`;buildPlan(imported);
 }catch(err){$('msg').textContent='読み込みに失敗しました：'+err.message}}
 rd.readAsArrayBuffer(f)
}
function render(){
 const a=getFiltered(),pubN=rows.filter(r=>r.published==='公開').length;
 if($('stats'))$('stats').innerHTML=`<div class="stat"><b>${rows.length}</b><span>登録事業所</span></div><div class="stat ok"><b>${pubN}</b><span>公開中</span></div><div class="stat"><b>${rows.length-pubN}</b><span>非公開</span></div><div class="stat"><b>${a.length}</b><span>表示中</span></div>`;
 $('list').innerHTML=a.length?`<div class="pgrid">`+a.map(r=>{const ph=photoPreview(r.photo1||r.photo2||r.photo3);return `<div class="pcard"><div class="pthumb">${ph?`<img src="${esc(ph)}" loading="lazy" alt="" onerror="this.remove()">`:'写真なし'}<span class="status ${r.published==='公開'?'open':''}">${esc(r.published)}</span></div><div class="pbody"><h3>${esc(r.name)}</h3><div class="muted">${esc(r.id)}　${esc(r.ward)}</div><div class="muted">${esc(r.address)}</div><div class="tags">${(r.types||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="ptimes">平日 ${esc(r.weekday)}<br>休日・長期休暇 ${esc(r.holiday)}<br>営業日 ${esc(r.openDays)}　閉所日 ${esc(r.closedDays)}</div></div><div class="pfoot"><button class="btn" onclick="edit('${esc(r.id)}')">編集</button></div></div>`}).join('')+`</div>`:'<p class="muted" style="margin-top:14px">該当する事業所はありません。</p>';
}
function edit(id){
 const r=rows.find(x=>x.id===id);if(!r)return;$('edit').style.display='block';
 $('edit').innerHTML=`<h2 class="edith">事業所を編集<small>${esc(r.id)}</small></h2><div class="grid">
 <div class="field"><label>事業所名</label><input id="e_name" value="${esc(r.name)}"></div><div class="field"><label>静岡市区</label><input id="e_ward" value="${esc(r.ward)}"></div>
 <div class="field full"><label>ふりがな（名前順の並び替えに使います）</label><input id="e_kana" value="${esc(r.kana||'')}" placeholder="例：しずおかでいさーびす"></div>
 <div class="field full"><label>事業所住所</label><input id="e_address" value="${esc(r.address)}"></div><div class="field"><label>電話番号</label><input id="e_phone" value="${esc(r.phone)}"></div><div class="field"><label>ホームページURL</label><input id="e_hp" value="${esc(r.hp)}"></div>
 <div class="field"><label>平日の営業時間</label><input id="e_weekday" value="${esc(r.weekday)}"></div><div class="field"><label>休日・長期休暇の営業時間</label><input id="e_holiday" value="${esc(r.holiday)}"></div>
 <div class="field"><label>営業日</label><input id="e_open" value="${esc(r.openDays)}"></div><div class="field"><label>閉所日</label><input id="e_closed" value="${esc(r.closedDays)}"></div>
 <div class="field"><label>送迎サービス</label><input id="e_transport" value="${esc(r.transport)}"></div><div class="field"><label>食事提供</label><input id="e_food" value="${esc(r.food)}"></div>
 <div class="field full"><label>主な通学先</label><textarea id="e_schools" rows="4">${esc((r.schools||[]).join('\n'))}</textarea></div><div class="field full"><label>事業所の説明（アピールポイント）</label><textarea id="e_appeal" rows="5">${esc(r.appeal)}</textarea></div>
 <div class="field full"><label>写真①</label><input id="e_photo1" value="${esc(r.photo1)}" placeholder="Google Driveの共有リンクなど"><div class="photoPreview"><img id="p_photo1" src="${esc(photoPreview(r.photo1))}" onerror="this.style.display='none'" ${r.photo1?'':'style="display:none"'}><span id="pt_photo1">${r.photo1?'':'写真①は未登録です'}</span></div></div>
 <div class="field full"><label>写真②</label><input id="e_photo2" value="${esc(r.photo2)}" placeholder="Google Driveの共有リンクなど"><div class="photoPreview"><img id="p_photo2" src="${esc(photoPreview(r.photo2))}" onerror="this.style.display='none'" ${r.photo2?'':'style="display:none"'}><span id="pt_photo2">${r.photo2?'':'写真②は未登録です'}</span></div></div>
 <div class="field full"><label>写真③</label><input id="e_photo3" value="${esc(r.photo3)}" placeholder="Google Driveの共有リンクなど"><div class="photoPreview"><img id="p_photo3" src="${esc(photoPreview(r.photo3))}" onerror="this.style.display='none'" ${r.photo3?'':'style="display:none"'}><span id="pt_photo3">${r.photo3?'':'写真③は未登録です'}</span></div></div>
 <div class="field"><label>公開</label><select id="e_pub"><option>非公開</option><option ${r.published==='公開'?'selected':''}>公開</option></select></div></div>
 <div class="actions"><button class="btn" onclick="$('edit').style.display='none'">閉じる</button><button class="btn green" onclick="save('${esc(r.id)}')">Firestoreに保存</button></div>`;
 ['1','2','3'].forEach(n=>{const el=$('e_photo'+n); if(el) el.addEventListener('input',()=>updatePhotoPreview(n));});
 $('edit').scrollIntoView({behavior:'smooth',block:'start'});
}
async function save(id){
 const r=rows.find(x=>x.id===id);if(!r)return;
 Object.assign(r,{name:$('e_name').value.trim(),kana:$('e_kana').value.trim(),ward:$('e_ward').value.trim(),address:$('e_address').value.trim(),phone:$('e_phone').value.trim(),hp:$('e_hp').value.trim(),weekday:$('e_weekday').value.trim(),holiday:$('e_holiday').value.trim(),openDays:$('e_open').value.trim(),closedDays:$('e_closed').value.trim(),transport:$('e_transport').value.trim(),food:$('e_food').value.trim(),schools:split($('e_schools').value),appeal:$('e_appeal').value.trim(),photo1:$('e_photo1').value.trim(),photo2:$('e_photo2').value.trim(),photo3:$('e_photo3').value.trim(),published:$('e_pub').value});
 if(!auth.currentUser){alert('先に管理者ログインをしてください。');return}
 try{await db.collection('providers').doc(r.id).set(r);$('edit').style.display='none';render();alert('Firestoreに保存しました。')}catch(e){alert('保存に失敗しました：'+e.message)}
}
async function loadFirestore(){
 if(!auth.currentUser)return;
 const snap=await db.collection('providers').get();
 rows=snap.docs.map(d=>({id:d.id,...d.data()}));render();$('msg').textContent=`Firestoreから${rows.length}件読み込みました。`;
}
function showLogin(){if($('login'))return;const p=document.createElement('div');p.id='login';p.className='panel';p.innerHTML=`<h2 style="margin-top:0">管理者ログイン</h2><div class="grid"><div class="field"><label>メールアドレス</label><input id="loginEmail" type="email"></div><div class="field"><label>パスワード</label><input id="loginPass" type="password"></div></div><div class="actions"><button class="btn primary" onclick="login()">ログイン</button></div><p id="loginMsg" class="muted"></p>`;document.querySelector('main').prepend(p)}
async function login(){try{await auth.signInWithEmailAndPassword($('loginEmail').value,$('loginPass').value)}catch(e){$('loginMsg').textContent='ログインできません：'+e.message}}
auth.onAuthStateChanged(u=>{document.body.classList.toggle('authed',!!u);if(u){if($('login'))$('login').remove();loadFirestore()}else{rows=[];plan=[];if($('plan'))$('plan').remove();$('edit').style.display='none';render();showLogin()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('edit').style.display='none';if(e.key==='Enter'&&e.target&&e.target.id==='loginPass')login()});
$('q').oninput=render;$('pub').onchange=render;render();
</script></body></html>
